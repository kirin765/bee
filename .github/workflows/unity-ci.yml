name: Unity CI (example)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Git LFS
        run: git lfs install

      # This uses game-ci Unity actions as an example. Unity license activation is required.
      - name: Run Unity tests (example)
        uses: game-ci/unity-test-runner@v2
        with:
          unityVersion: '2021.3.0f1'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      # You can also use game-ci/unity-builder to build players. See action docs for secrets.
